<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px 0;background:#FAF7F2;font-family:Inter,Arial,sans-serif;color:#1F2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 16px;font-size:28px;">
                  <span style="color:#C2410C;">Desi</span><span style="color:#0F4C5C;">network</span>
                </h1>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Here is your sign-in code:</p>
                <p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:6px;color:#0F4C5C;">{{ .Token }}</p>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Enter it on Desinetwork to continue. The code expires in 10 minutes.</p>
                <p style="margin:24px 0 0;font-size:12px;line-height:18px;color:#6B7280;">
                  If you didn't ask for this code, you can ignore this email. Desinetwork will never ask you for this code by phone or message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
